name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "45 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install verified TruffleHog
        env:
          TRUFFLEHOG_VERSION: 3.90.8
          TRUFFLEHOG_SHA256: aa2258dc4e76d93518730331e69ca01a638c365ab862a828c566e025f6c8150c
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${RUNNER_TEMP}/trufflehog.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/trufflehog-bin"
          tar --extract --gzip --file "$RUNNER_TEMP/trufflehog.tar.gz" \
            --directory "$RUNNER_TEMP/trufflehog-bin" trufflehog

      - name: Scan for secrets
        run: >-
          "$RUNNER_TEMP/trufflehog-bin/trufflehog"
          git "file://${GITHUB_WORKSPACE}"
          --branch HEAD
          --only-verified
          --fail
          --no-update
